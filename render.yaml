# Exported Blueprint for Render
# https://render.com/docs/blueprint-spec
#
# Se criar o serviço manualmente (sem Blueprint), use Root Directory vazio
# e os comandos abaixo (já apontam para apps/api e apps/web).

databases:
  - name: fazenda-db
    plan: free

services:
  - type: web
    name: fazenda-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
      - key: DATABASE_URL
        fromDatabase:
          name: fazenda-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SEED_ON_BOOT
        value: "false"
      - key: ALLOW_PUBLIC_REGISTER
        value: "false"
      - key: CORS_ORIGIN
        value: "https://fazenda-web.onrender.com"

  - type: web
    name: fazenda-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build:web
    startCommand: npm run start:web
    envVars:
      - key: NODE_VERSION
        value: "22.20.0"
      # Proxy same-origin /api/* -> API (cookies httpOnly first-party).
      # Ex.: https://fazenda-api.onrender.com  (NEXT_PUBLIC_API_URL fica vazio)
      - key: API_PROXY_TARGET
        sync: false
