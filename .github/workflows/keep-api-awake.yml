name: Manter API acordada (Render free)

# O plano free do Render "dorme" a API após ~15 min sem acesso; o primeiro acesso
# depois disso demora 1-2 min e o proxy da web responde 502 nesse intervalo.
# Este job chama /health a cada 10 min SOMENTE em horário comercial
# (07h-19h de Brasília, seg-sáb) para não consumir as ~750 h/mês do plano free.
#
# Para mudar a URL sem editar o arquivo: Settings > Secrets and variables >
# Actions > Variables > API_HEALTH_URL.

on:
  schedule:
    # UTC: 10h-21h59 = 07h-18h59 em Brasília (UTC-3)
    - cron: "*/10 10-21 * * 1-6"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://fazenda-api-0gp3.onrender.com/api/v1/health' }}
    steps:
      - name: Chamar /health (acorda a API se estiver dormindo)
        run: |
          # Cold start pode levar ~2 min: tentativas com espera entre elas.
          if curl --fail --silent --show-error \
               --max-time 150 --retry 2 --retry-delay 20 --retry-all-errors \
               "$API_HEALTH_URL"; then
            echo
            echo "API respondeu."
          else
            # Não falha o job (evita e-mail a cada 10 min se a API estiver fora).
            echo "::warning::API não respondeu em $API_HEALTH_URL"
          fi
